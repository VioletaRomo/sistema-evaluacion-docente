<div style="max-width: 600px; margin: 50px auto; font-family: sans-serif;">
  <h1 style="text-align: center; color: #2c3e50;">🎓 Evaluación Docente</h1>

  <div style="border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold;">Asignatura:</label>
      <select [(ngModel)]="evaluation.course" style="width: 100%; padding: 8px;">
        <option *ngFor="let c of courses" [value]="c">{{c}}</option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold;">Docente:</label>
      <select [(ngModel)]="evaluation.teacherId" style="width: 100%; padding: 8px;">
        <option *ngFor="let t of teachers" [value]="t.id">{{t.name}}</option>
      </select>
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold;">Nota (1 al 7):</label>
      <input type="number" [(ngModel)]="evaluation.score" min="1" max="7" style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold;">Comentario:</label>
      <textarea [(ngModel)]="evaluation.comment" rows="4" style="width: 100%; padding: 8px;"></textarea>
    </div>

    <button (click)="submit()" style="width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
      Enviar Evaluación 🚀
    </button>
  </div>
</div>
